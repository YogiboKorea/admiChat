<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B 게시판 등록 관리자</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0EA5E9;
      --primary-hover: #0284C7;
      --danger: #EF4444;
      --danger-hover: #DC2626;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 2rem;
    }

    .container {
      background: var(--surface);
      width: 100%;
      max-width: 800px;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    h1, h2 {
      font-weight: 700;
      margin-bottom: 2rem;
      color: var(--text);
    }
    
    h1 { font-size: 1.5rem; text-align: center; }
    h2 { font-size: 1.25rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
    }

    .file-upload-wrapper {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      background: #F8FAFC;
    }

    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload-text {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .preview-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 1rem;
    }

    .preview-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-item .remove-btn {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(255,0,0,0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      padding: 1rem;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .submit-btn { background: var(--primary); }
    .submit-btn:hover { background: var(--primary-hover); }
    .cancel-btn { background: var(--text-muted); margin-top: 0.5rem; display: none; }

    /* List Styles */
    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .list-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .list-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .list-item-content {
      padding: 1rem;
      flex-grow: 1;
    }

    .list-item-title { font-weight: 700; margin-bottom: 0.25rem; font-size: 1.1rem; }
    .list-item-cat { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1rem; }

    .list-item-actions {
      display: flex;
      gap: 0.5rem;
      padding: 0 1rem 1rem 1rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-btn { background: var(--primary); color: white; }
    .delete-btn { background: var(--danger); color: white; }

    /* Drag & Drop */
    .list-item {
      cursor: default;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .list-item.sortable-chosen { box-shadow: 0 8px 24px rgba(0,0,0,0.15); transform: scale(1.02); }
    .list-item.sortable-ghost { opacity: 0.35; }

    .drag-handle {
      display: flex; align-items: center; justify-content: center;
      padding: 0.5rem; color: #94A3B8; cursor: grab; font-size: 1.1rem;
      background: #F8FAFC;
    }
    .drag-handle:active { cursor: grabbing; }

    .sort-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding: 0.75rem 1rem;
      background: #EFF6FF; border-radius: 10px; border: 1px solid #BFDBFE;
    }
    .sort-bar span { font-size: 0.875rem; color: #1D4ED8; font-weight: 500; }
    .save-order-btn {
      padding: 0.5rem 1.25rem; background: #1D4ED8; color: white;
      border: none; border-radius: 8px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }
    .save-order-btn:hover { background: #1E40AF; }
    .save-order-btn:disabled { background: #94A3B8; cursor: not-allowed; }

  </style>
</head>
<body>

  <div class="container">
    <h1 id="formTitle">B2B 레퍼런스 등록</h1>
    <form id="uploadForm">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label for="category">카테고리</label>
        <select id="category" name="category" required>
          <option value="">카테고리를 선택하세요</option>
          <option value="여행·숙박">여행·숙박</option>
          <option value="스포츠">스포츠</option>
          <option value="쇼핑·팝업">쇼핑·팝업</option>
          <option value="문화·전시">문화·전시</option>
          <option value="기업·오피스">기업·오피스</option>
        </select>
      </div>

      <div class="form-group">
        <label for="title">타이틀</label>
        <input type="text" id="title" name="title" placeholder="레퍼런스 타이틀을 입력하세요" required>
      </div>

      <div class="form-group">
        <label>이미지 등록 (최대 10개)</label>
        <div class="file-upload-wrapper">
          <input type="file" id="images" name="images" accept="image/*" multiple>
          <div class="file-upload-text">
            클릭하여 <strong>새 이미지 추가</strong><br>
            <span style="font-size:0.75rem; color:#94a3b8; margin-top:0.5rem; display:block;">기존 이미지 포함 최대 10장</span>
          </div>
        </div>
        <div class="preview-container" id="previewContainer"></div>
      </div>

      <button type="submit" class="btn submit-btn" id="submitBtn">등록하기</button>
      <button type="button" class="btn cancel-btn" id="cancelBtn" onclick="resetForm()">수정 취소</button>
    </form>
  </div>

  <div class="container">
    <h2>등록된 레퍼런스 목록</h2>
    <div class="sort-bar">
      <span>☰ 드래그하여 순서를 변경할 수 있습니다</span>
      <button class="save-order-btn" id="saveOrderBtn" onclick="saveOrder()">순서 저장</button>
    </div>
    <div class="list-grid" id="listContainer">
      <!-- Items will be loaded here -->
    </div>
  </div>

  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <script>
    const API_BASE = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app/api/b2b';
    
    const form = document.getElementById('uploadForm');
    const imagesInput = document.getElementById('images');
    const previewContainer = document.getElementById('previewContainer');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const listContainer = document.getElementById('listContainer');
    const saveOrderBtn = document.getElementById('saveOrderBtn');
    
    let selectedFiles = [];
    let retainedImages = [];
    let allBoards = [];
    let sortableInstance = null;

    // Fetch and display boards
    async function loadBoards() {
      try {
        const res = await fetch(`${API_BASE}/boards`);
        const json = await res.json();
        if(json.success) {
          allBoards = json.data;
          renderList();
        }
      } catch(e) {
        console.error(e);
      }
    }

    function renderList() {
      listContainer.innerHTML = '';
      if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }

      allBoards.forEach(board => {
        const cover = board.images && board.images.length > 0 ? board.images[0] : '';
        const coverUrl = cover 
          ? (cover.startsWith('http') ? cover : `https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app${cover}`) 
          : 'https://via.placeholder.com/220x150';
        
        const item = document.createElement('div');
        item.className = 'list-item';
        item.dataset.id = board._id;
        item.innerHTML = `
          <div class="drag-handle" title="드래그하여 순서 변경">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/>
              <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
              <circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/>
            </svg>
          </div>
          <img src="${coverUrl}" alt="cover">
          <div class="list-item-content">
            <div class="list-item-title">${board.title}</div>
            <div class="list-item-cat">${board.category}</div>
          </div>
          <div class="list-item-actions">
            <button class="action-btn edit-btn" onclick="editBoard('${board._id}')">수정</button>
            <button class="action-btn delete-btn" onclick="deleteBoard('${board._id}')">삭제</button>
          </div>
        `;
        listContainer.appendChild(item);
      });

      // Init SortableJS
      sortableInstance = Sortable.create(listContainer, {
        animation: 180,
        handle: '.drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd: () => {
          saveOrderBtn.style.background = '#1D4ED8';
          saveOrderBtn.textContent = '순서 저장 ●';
        }
      });
    }

    async function saveOrder() {
      const items = listContainer.querySelectorAll('.list-item');
      const orderedIds = Array.from(items).map(el => el.dataset.id);
      saveOrderBtn.disabled = true;
      saveOrderBtn.textContent = '저장 중...';
      try {
        const res = await fetch(`${API_BASE.replace('/b2b', '')}/b2b/reorder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderedIds })
        });
        const json = await res.json();
        if (json.success) {
          saveOrderBtn.textContent = '✓ 저장됨';
          saveOrderBtn.style.background = '#16A34A';
          setTimeout(() => {
            saveOrderBtn.textContent = '순서 저장';
            saveOrderBtn.style.background = '';
            saveOrderBtn.disabled = false;
          }, 2000);
        } else {
          alert('저장 실패: ' + json.message);
          saveOrderBtn.disabled = false;
          saveOrderBtn.textContent = '순서 저장';
        }
      } catch(e) {
        alert('서버 오류가 발생했습니다.');
        saveOrderBtn.disabled = false;
        saveOrderBtn.textContent = '순서 저장';
      }
    }

    // Handle new file selection
    imagesInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (retainedImages.length + selectedFiles.length + files.length > 10) {
        alert('이미지는 총 10개까지만 등록 가능합니다.');
        imagesInput.value = '';
        return;
      }
      selectedFiles = [...selectedFiles, ...files];
      renderPreviews();
    });

    function renderPreviews() {
      previewContainer.innerHTML = '';
      
      // Render retained images (for edit mode)
      retainedImages.forEach((url, index) => {
        const fullUrl = url.startsWith('http') ? url : `https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app${url}`;
        const div = document.createElement('div');
        div.className = 'preview-item';
        div.innerHTML = `
          <img src="${fullUrl}" alt="old">
          <button type="button" class="remove-btn" onclick="removeRetained(${index})">X</button>
        `;
        previewContainer.appendChild(div);
      });

      // Render new files
      selectedFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = `
            <img src="${e.target.result}" alt="new">
            <button type="button" class="remove-btn" onclick="removeNewFile(${index})">X</button>
          `;
          previewContainer.appendChild(div);
        }
        reader.readAsDataURL(file);
      });
    }

    function removeRetained(index) {
      retainedImages.splice(index, 1);
      renderPreviews();
    }

    function removeNewFile(index) {
      selectedFiles.splice(index, 1);
      renderPreviews();
    }

    // Submit form (Create or Update)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editId = document.getElementById('editId').value;
      if (retainedImages.length === 0 && selectedFiles.length === 0) {
        alert('최소 1개의 이미지를 등록해주세요.');
        return;
      }

      const formData = new FormData();
      formData.append('category', document.getElementById('category').value);
      formData.append('title', document.getElementById('title').value);
      
      if (editId) {
        formData.append('retainedImages', JSON.stringify(retainedImages));
      }

      selectedFiles.forEach(file => {
        formData.append('images', file);
      });

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = '처리 중...';

        const url = editId ? `${API_BASE}/board/${editId}` : `${API_BASE}/board`;
        const method = editId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method: method,
          body: formData
        });

        const result = await response.json();
        
        if (result.success) {
          alert(editId ? '수정되었습니다.' : '등록되었습니다.');
          resetForm();
          loadBoards();
        } else {
          alert('오류 발생: ' + result.message);
        }
      } catch (error) {
        alert('서버 오류가 발생했습니다.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = editId ? '수정하기' : '등록하기';
      }
    });

    // Delete
    async function deleteBoard(id) {
      if(!confirm('정말 삭제하시겠습니까?')) return;
      try {
        const res = await fetch(`${API_BASE}/board/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if(json.success) {
          alert('삭제되었습니다.');
          loadBoards();
        }
      } catch(e) {
        alert('삭제 중 오류가 발생했습니다.');
      }
    }

    // Edit Mode
    function editBoard(id) {
      const board = allBoards.find(b => b._id === id);
      if(!board) return;

      document.getElementById('formTitle').textContent = 'B2B 레퍼런스 수정';
      document.getElementById('editId').value = board._id;
      document.getElementById('category').value = board.category;
      document.getElementById('title').value = board.title;
      
      retainedImages = [...(board.images || [])];
      selectedFiles = [];
      imagesInput.value = '';
      
      submitBtn.textContent = '수정하기';
      cancelBtn.style.display = 'block';
      
      renderPreviews();
      window.scrollTo(0, 0);
    }

    function resetForm() {
      document.getElementById('formTitle').textContent = 'B2B 레퍼런스 등록';
      document.getElementById('editId').value = '';
      form.reset();
      
      retainedImages = [];
      selectedFiles = [];
      previewContainer.innerHTML = '';
      
      submitBtn.textContent = '등록하기';
      cancelBtn.style.display = 'none';
    }

    // Init
    loadBoards();
  </script>
</body>
</html>
