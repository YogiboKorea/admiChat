<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B 게시판 등록 관리자</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0EA5E9;
      --primary-hover: #0284C7;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      text-align: center;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
    }

    .file-upload-wrapper {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #F8FAFC;
    }

    .file-upload-wrapper:hover {
      border-color: var(--primary);
      background: #F0F9FF;
    }

    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload-text {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .file-upload-text strong {
      color: var(--primary);
      font-weight: 600;
    }

    .preview-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 1rem;
    }

    .preview-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:disabled {
      background: #CBD5E1;
      cursor: not-allowed;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>B2B 레퍼런스 등록</h1>
    <form id="uploadForm">
      <div class="form-group">
        <label for="category">카테고리</label>
        <select id="category" name="category" required>
          <option value="">카테고리를 선택하세요</option>
          <option value="여행·숙박">여행·숙박</option>
          <option value="스포츠">스포츠</option>
          <option value="쇼핑·팝업">쇼핑·팝업</option>
          <option value="문화·전시">문화·전시</option>
          <option value="기업·오피스">기업·오피스</option>
        </select>
      </div>

      <div class="form-group">
        <label for="title">타이틀</label>
        <input type="text" id="title" name="title" placeholder="레퍼런스 타이틀을 입력하세요" required>
      </div>

      <div class="form-group">
        <label>이미지 등록 (최대 10개)</label>
        <div class="file-upload-wrapper">
          <input type="file" id="images" name="images" accept="image/*" multiple required>
          <div class="file-upload-text">
            클릭하여 <strong>이미지 선택</strong> 또는 드래그 앤 드롭<br>
            <span style="font-size:0.75rem; color:#94a3b8; margin-top:0.5rem; display:block;">(최대 10장)</span>
          </div>
        </div>
        <div class="preview-container" id="previewContainer"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">등록하기</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const imagesInput = document.getElementById('images');
    const previewContainer = document.getElementById('previewContainer');
    const submitBtn = document.getElementById('submitBtn');

    let selectedFiles = [];

    imagesInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      
      if (files.length > 10) {
        alert('이미지는 최대 10개까지만 등록할 수 있습니다.');
        imagesInput.value = '';
        previewContainer.innerHTML = '';
        selectedFiles = [];
        return;
      }

      selectedFiles = files;
      previewContainer.innerHTML = '';

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = `<img src="${e.target.result}" alt="preview">`;
          previewContainer.appendChild(div);
        }
        reader.readAsDataURL(file);
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (selectedFiles.length === 0) {
        alert('최소 1개의 이미지를 등록해주세요.');
        return;
      }

      const formData = new FormData();
      formData.append('category', document.getElementById('category').value);
      formData.append('title', document.getElementById('title').value);
      
      selectedFiles.forEach(file => {
        formData.append('images', file);
      });

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = '등록 중...';

        const response = await fetch('https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app/api/b2b/board', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        
        if (result.success) {
          alert('성공적으로 등록되었습니다.');
          form.reset();
          previewContainer.innerHTML = '';
          selectedFiles = [];
        } else {
          alert('등록에 실패했습니다: ' + result.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('서버 오류가 발생했습니다.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '등록하기';
      }
    });
  </script>
</body>
</html>
