<style>
    /* ─── INQUIRY FORM ─── */
    .inquiry-section {
        background: var(--yogibo-gray);
    }

    .inquiry-layout {
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 64px;
        align-items: start;
    }

    .inquiry-info h2 {
        font-size: 34px;
        font-weight: 900;
        color: var(--yogibo-dark);
        letter-spacing: -1px;
        margin-bottom: 16px;
        line-height: 1.3;
    }

    .inquiry-info p {
        font-size: 15px;
        color: var(--yogibo-text-muted);
        line-height: 1.8;
        margin-bottom: 36px;
    }

    .inquiry-contact-item {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
    }

    .contact-icon {
        width: 44px;
        height: 44px;
        background: var(--yogibo-blue-light);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
        border: 1.5px solid var(--yogibo-blue-mid);
    }

    .contact-text strong {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: var(--yogibo-dark);
        margin-bottom: 2px;
    }

    .contact-text span {
        font-size: 13px;
        color: var(--yogibo-text-muted);
    }

    .inquiry-form {
        background: white;
        border-radius: var(--radius-xl);
        padding: 44px;
        box-shadow: var(--shadow-card);
    }

    .form-row {
        margin-bottom: 20px;
    }

    .form-row label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--yogibo-dark);
        margin-bottom: 8px;
    }

    .form-row label .req {
        color: var(--yogibo-blue);
        margin-left: 2px;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
        width: 100%;
        padding: 13px 16px;
        border: 1.5px solid var(--yogibo-gray-mid);
        border-radius: 12px;
        font-size: 14px;
        font-family: 'Noto Sans KR', sans-serif;
        color: var(--yogibo-text);
        background: var(--yogibo-gray);
        transition: all 0.2s;
        outline: none;
        -webkit-appearance: none;
    }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
        border-color: var(--yogibo-blue);
        background: white;
        box-shadow: 0 0 0 3px rgba(0, 174, 239, 0.1);
    }

    .form-row textarea {
        height: 110px;
        resize: vertical;
    }

    .form-two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .form-submit {
        width: 100%;
        background: var(--yogibo-blue);
        color: white;
        border: none;
        cursor: pointer;
        padding: 16px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        font-family: 'Noto Sans KR', sans-serif;
        transition: all 0.25s;
        margin-top: 8px;
        box-shadow: 0 4px 16px rgba(0, 174, 239, 0.3);
    }

    .form-submit:hover {
        background: var(--yogibo-blue-dark);
        transform: translateY(-1px);
    }

    .form-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    /* 결과 메시지 */
    .inquiry-result-msg {
        display: none;
        padding: 16px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        margin-top: 16px;
        text-align: center;
    }
    .inquiry-result-msg.success {
        background: #e6f9f0;
        color: #1a7a4a;
        border: 1.5px solid #b2e8d0;
    }
    .inquiry-result-msg.error {
        background: #fff0f0;
        color: #c0392b;
        border: 1.5px solid #f5c6c6;
    }
</style>

<!-- INQUIRY FORM -->
<section class="inquiry-section" id="inquiry">
    <div class="section-inner">
        <div class="inquiry-layout">
            <div class="inquiry-info">
                <div class="section-label">CONTACT US</div>
                <h2>대량구매 문의를<br>남겨주세요</h2>
                <p>기업·기관·상업시설 담당자분들의 대량구매 및 납품 문의를 접수합니다. 양식 작성 후 제출하시면 영업일 기준 1~2일 내 담당자가 연락드립니다.</p>
                <div class="inquiry-contact-item">
                    <div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.6">
                            <path d="M3 22h18M3 10h18M5 6l7-4 7 4M4 10v12M20 10v12M8 10v12M12 10v12M16 10v12" />
                        </svg></div>
                    <div class="contact-text">
                        <strong>BANK INFO</strong>
                        <span>하나은행 591-910034-05004</span>
                    </div>
                </div>
            </div>

            <div class="inquiry-form">
                <div class="form-two-col">
                    <div class="form-row">
                        <label>담당자명 <span class="req">*</span></label>
                        <input type="text" id="inq-name" placeholder="홍길동">
                    </div>
                    <div class="form-row">
                        <label>회사/기관명 <span class="req">*</span></label>
                        <input type="text" id="inq-company" placeholder="(주)회사명">
                    </div>
                </div>
                <div class="form-two-col">
                    <div class="form-row">
                        <label>휴대폰번호 <span class="req">*</span></label>
                        <input type="tel" id="inq-phone" placeholder="010-1234-5678">
                    </div>
                    <div class="form-row">
                        <label>이메일주소 <span class="req">*</span></label>
                        <input type="email" id="inq-email" placeholder="example@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <label>납품 주소</label>
                    <input type="text" id="inq-address" placeholder="납품 받으실 주소를 입력해 주세요">
                </div>

                <!-- 예산 구간 -->
                <div class="form-row">
                    <span class="form-field-label">예산 구간 (단위: 만원)<span class="req">*</span></span>
                    <div class="budget-grid">
                        <div class="budget-card" onclick="selectBudget(this)">
                            <span class="bud-main">300 ~ 500만원</span>
                            <span class="bud-sub">소규모 · 1~2개 공간</span>
                        </div>
                        <div class="budget-card" onclick="selectBudget(this)">
                            <span class="bud-main">500 ~ 1,000만원</span>
                            <span class="bud-sub">중규모 · 복수 공간</span>
                        </div>
                        <div class="budget-card" onclick="selectBudget(this)">
                            <span class="bud-main">1,000 ~ 3,000만원</span>
                            <span class="bud-sub">대규모 · 다층 시설</span>
                        </div>
                        <div class="budget-card" onclick="selectBudget(this)">
                            <span class="bud-main">3,000만원 이상</span>
                            <span class="bud-sub">엔터프라이즈 · 별도 협의</span>
                        </div>
                    </div>
                </div>

                <!-- 관심 상품 -->
                <div class="form-row">
                    <span class="form-field-label">관심 있는 상품<span class="opt-note">(복수 선택 가능)</span></span>
                    <div class="opt-group" id="productsGroup">
                        <label class="opt-btn"><input type="checkbox" onchange="toggleOpt(this)">맥스</label>
                        <label class="opt-btn"><input type="checkbox" onchange="toggleOpt(this)">서포트</label>
                        <label class="opt-btn"><input type="checkbox" onchange="toggleOpt(this)">슬림</label>
                        <label class="opt-btn"><input type="checkbox" onchange="toggleOpt(this)">팟</label>
                        <label class="opt-btn"><input type="checkbox" onchange="toggleOpt(this)">드롭</label>
                        <label class="opt-btn"><input type="checkbox" onchange="toggleOpt(this)">피라미드</label>
                        <label class="opt-btn"><input type="checkbox" onchange="toggleOpt(this)">아직 모르겠어요</label>
                    </div>
                </div>

                <!-- 케어서비스 -->
                <div class="form-row">
                    <span class="form-field-label">케어서비스<span class="req">*</span></span>
                    <div class="opt-group" id="careGroup">
                        <label class="opt-btn"><input type="radio" name="care"
                                onchange="toggleRadio(this,'careGroup')">포함</label>
                        <label class="opt-btn"><input type="radio" name="care"
                                onchange="toggleRadio(this,'careGroup')">미포함</label>
                    </div>
                </div>

                <div class="form-row">
                    <label>추가 문의</label>
                    <textarea id="inq-message" placeholder="공간 규모, 납기 희망일, 기타 요청사항 등 자유롭게 작성해 주세요."></textarea>
                </div>
                <div class="form-row">
                    <label>첨부파일</label>
                    <label class="file-upload-zone">
                        <input type="file" id="inq-files" multiple accept=".pdf,.jpg,.jpeg,.png,.ppt,.pptx"
                            style="display:none;" onchange="updateFileLabel(this)">
                        <span class="file-upload-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.6">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                            </svg></span>
                        <span class="file-upload-main" id="inq-file-label">파일 선택 또는 드래그 앤 드롭</span>
                        <span class="file-upload-sub">도면, 공간 사진, 견적 요청서 등 · PDF, JPG, PNG, PPT 최대 10MB</span>
                    </label>
                </div>
                <button class="form-submit" id="inq-submit-btn" onclick="submitInquiry()">문의 제출하기 →</button>
                <div class="inquiry-result-msg" id="inq-result-msg"></div>
            </div>
        </div>
    </div>
</section>

<script>
(function () {
    var selectedBudget = '';

    // 파일 선택 시 라벨 업데이트
    window.updateFileLabel = function (input) {
        var label = document.getElementById('inq-file-label');
        if (input.files && input.files.length > 0) {
            label.textContent = input.files.length + '개 파일 선택됨: ' +
                Array.from(input.files).map(function (f) { return f.name; }).join(', ');
        } else {
            label.textContent = '파일 선택 또는 드래그 앤 드롭';
        }
    };

    // 예산 카드 선택
    window.selectBudget = function (el) {
        document.querySelectorAll('.budget-card').forEach(function (c) { c.classList.remove('active'); });
        el.classList.add('active');
        selectedBudget = el.querySelector('.bud-main').textContent.trim();
    };

    // 결과 메시지 표시
    function showMsg(msg, type) {
        var el = document.getElementById('inq-result-msg');
        el.textContent = msg;
        el.className = 'inquiry-result-msg ' + type;
        el.style.display = 'block';
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 폼 초기화
    function resetForm() {
        ['inq-name', 'inq-company', 'inq-phone', 'inq-email', 'inq-address', 'inq-message'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.value = '';
        });
        document.getElementById('inq-file-label').textContent = '파일 선택 또는 드래그 앤 드롭';
        var fileInput = document.getElementById('inq-files');
        if (fileInput) fileInput.value = '';
        document.querySelectorAll('.budget-card').forEach(function (c) { c.classList.remove('active'); });
        document.querySelectorAll('#productsGroup input[type="checkbox"]').forEach(function (cb) {
            cb.checked = false;
            cb.closest('label').classList.remove('active');
        });
        document.querySelectorAll('input[name="care"]').forEach(function (r) {
            r.checked = false;
            r.closest('label').classList.remove('active');
        });
        selectedBudget = '';
    }

    // 문의 제출
    window.submitInquiry = async function () {
        var name    = (document.getElementById('inq-name').value || '').trim();
        var company = (document.getElementById('inq-company').value || '').trim();
        var phone   = (document.getElementById('inq-phone').value || '').trim();
        var email   = (document.getElementById('inq-email').value || '').trim();
        var address = (document.getElementById('inq-address').value || '').trim();
        var message = (document.getElementById('inq-message').value || '').trim();
        var fileInput = document.getElementById('inq-files');

        // 케어서비스
        var careRadio = document.querySelector('input[name="care"]:checked');
        var care = careRadio ? careRadio.closest('label').textContent.trim() : '';

        // 관심 상품
        var products = Array.from(
            document.querySelectorAll('#productsGroup input[type="checkbox"]:checked')
        ).map(function (cb) { return cb.closest('label').textContent.trim(); }).join(', ');

        // 유효성 검사
        if (!name)    return showMsg('담당자명을 입력해주세요.', 'error');
        if (!company) return showMsg('회사/기관명을 입력해주세요.', 'error');
        if (!phone)   return showMsg('휴대폰번호를 입력해주세요.', 'error');
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
                      return showMsg('올바른 이메일 주소를 입력해주세요.', 'error');
        // 제출 시점에 DOM에서 직접 읽기 (변수 의존 제거)
        var activeBudgetEl = document.querySelector('.budget-card.active .bud-main');
        var selectedBudget = activeBudgetEl ? activeBudgetEl.textContent.trim() : '';
        if (!selectedBudget) return showMsg('예산 구간을 선택해주세요.', 'error');
        if (!care)    return showMsg('케어서비스 포함 여부를 선택해주세요.', 'error');

        var btn = document.getElementById('inq-submit-btn');
        btn.disabled = true;
        btn.textContent = '전송 중...';
        document.getElementById('inq-result-msg').style.display = 'none';

        try {
            var formData = new FormData();
            formData.append('name', name);
            formData.append('company', company);
            formData.append('phone', phone);
            formData.append('email', email);
            formData.append('address', address);
            formData.append('budget', selectedBudget);
            formData.append('products', products);
            formData.append('care', care);
            formData.append('message', message);

            if (fileInput && fileInput.files) {
                Array.from(fileInput.files).forEach(function (file) {
                    formData.append('files', file);
                });
            }

            var BASE_URL = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app';
            var res = await fetch(BASE_URL + '/api/b2b/inquiry', {
                method: 'POST',
                body: formData
            });
            var data = await res.json();

            if (data.success) {
                showMsg('✅ 문의가 접수되었습니다! 영업일 1~2일 내 담당자가 연락드립니다.', 'success');
                resetForm();
            } else {
                showMsg('❌ ' + (data.message || '오류가 발생했습니다. 다시 시도해주세요.'), 'error');
            }
        } catch (e) {
            console.error('[B2B 문의 오류]', e);
            showMsg('❌ 네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '문의 제출하기 →';
        }
    };
})();
</script>
