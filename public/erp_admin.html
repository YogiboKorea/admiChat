<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이카운트 판매현황 적재</title>
  <style>
    :root {
      --bg:#f2f4f6; --card:#fff; --primary:#3182f6; --primary-d:#1b64da;
      --txt:#191f28; --txt2:#4e5968; --txt3:#8b95a1; --line:#e5e8eb;
      --ok:#00c471; --warn:#ff9500; --bad:#f04452;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--txt);
      font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Segoe UI',sans-serif;
      -webkit-font-smoothing:antialiased; }
    .wrap { max-width:940px; margin:0 auto; padding:28px 20px 80px; }
    h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; margin:0 0 4px; }
    .sub { color:var(--txt2); font-size:14px; margin-bottom:22px; }

    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px; }
    .stat { background:var(--card); border-radius:18px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .stat .k { color:var(--txt3); font-size:13px; }
    .stat .v { font-size:26px; font-weight:800; margin-top:8px; letter-spacing:-0.5px; }
    .v.ok { color:var(--ok); }

    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    input { border:1px solid var(--line); background:#fff; color:var(--txt); border-radius:12px; padding:12px 14px; font-size:15px; font-family:inherit; }
    input:focus { outline:2px solid var(--primary); border-color:transparent; }
    .btn { border:none; border-radius:12px; font-weight:700; cursor:pointer; font-size:15px; font-family:inherit; padding:12px 18px; transition:.15s; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:active { background:var(--primary-d); transform:scale(.98); }
    .btn-primary:disabled { background:#c9d1da; cursor:not-allowed; }
    .btn-ghost { background:#fff; color:var(--txt); border:1px solid var(--line); }
    label.upload { padding:12px 18px; border-radius:12px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:700; font-size:15px; }

    .msg { padding:14px 16px; border-radius:12px; margin-bottom:16px; font-size:14px; display:none; white-space:pre-wrap; line-height:1.6; }
    .msg.show { display:block; }
    .msg.ok { background:#e7f9f1; color:#00a35f; }
    .msg.err { background:#fde8ea; color:#c0303c; }

    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th,td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { color:var(--txt3); font-weight:700; font-size:13px; position:sticky; top:0; background:#fff; }
    tr:last-child td { border-bottom:none; }
    .tablewrap { background:var(--card); border-radius:18px; padding:6px 8px; box-shadow:0 1px 3px rgba(0,0,0,.04); overflow:auto; max-height:56vh; }
    .pill { font-size:11.5px; padding:4px 10px; border-radius:20px; font-weight:700; }
    .pill.mobile { background:#e7f9f1; color:#00a35f; }
    .pill.safe,.pill.other,.pill.empty { background:#fff4e6; color:#d97706; }
    .spin { display:inline-block; width:15px; height:15px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:s .7s linear infinite; vertical-align:-3px; margin-right:7px; }
    @keyframes s { to { transform:rotate(360deg); } }
    .muted { color:var(--txt3); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>이카운트 판매현황 적재</h1>
    <div class="sub">data.xlsx (매크로 다운로드본) → MongoDB · 휴대폰번호 기준 정품인증 매칭 데이터</div>

    <div id="msg" class="msg"></div>

    <div class="grid">
      <div class="stat"><div class="k">전체 판매 라인</div><div class="v" id="s-total">-</div></div>
      <div class="stat"><div class="k">매칭 가능 (010)</div><div class="v ok" id="s-match">-</div></div>
      <div class="stat"><div class="k">고유 매칭 고객</div><div class="v ok" id="s-uniq">-</div></div>
      <div class="stat"><div class="k">최근 동기화</div><div class="v" id="s-last" style="font-size:15px;">-</div></div>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary" id="btn-sync" onclick="doSync()">🔄 data.xlsx 동기화</button>
      <label class="upload">📁 파일 업로드<input type="file" id="file" accept=".xlsx" style="display:none" onchange="doUpload(this)" /></label>
      <span style="flex:1"></span>
      <input type="text" id="q-name" placeholder="고객명" style="width:120px" />
      <input type="text" id="q-phone" placeholder="휴대폰번호" style="width:150px" />
      <button class="btn btn-ghost" onclick="loadSales(1)">검색</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>구매일</th><th>주문키</th><th>채널</th><th>품목코드</th><th>품목명</th>
          <th>규격</th><th>수량</th><th>금액</th><th>고객명</th><th>연락처</th><th>유형</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="11" class="muted" style="padding:22px;text-align:center;">검색을 눌러 데이터를 조회하세요.</td></tr></tbody>
      </table>
    </div>
  </div>

<script>
const ADMIN_SERVER = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app';
const API = (location.origin === ADMIN_SERVER || location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : ADMIN_SERVER;
const $ = (id) => document.getElementById(id);
function showMsg(text, ok) { const el = $('msg'); el.textContent = text; el.className = 'msg show ' + (ok ? 'ok' : 'err'); }
function fmtDate(d) { return d ? new Date(d).toLocaleString('ko-KR') : '-'; }
function num(n) { return (n ?? 0).toLocaleString('ko-KR'); }
async function jsonFetch(url, opts) {
  const r = await fetch(url, opts); const t = await r.text();
  if (!t) throw new Error('서버 응답이 비어 있습니다. (' + r.status + ')');
  try { return JSON.parse(t); } catch (e) { throw new Error('서버 응답 형식 오류 (' + r.status + ')'); }
}

async function loadStats() {
  try {
    const r = await jsonFetch(API + '/api/erp/stats');
    if (!r.success) return;
    $('s-total').textContent = num(r.total);
    $('s-match').textContent = num(r.matchable);
    $('s-uniq').textContent = num(r.uniqueMatchablePhones);
    $('s-last').textContent = r.lastSync ? fmtDate(r.lastSync.at) : '없음';
  } catch (e) {}
}

async function doSync() {
  const btn = $('btn-sync'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>동기화 중...';
  try {
    const r = await jsonFetch(API + '/api/erp/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    if (r.success) {
      showMsg(`✅ 동기화 완료\n· 전체 ${num(r.stats.kept)}줄 (스킵 ${r.stats.skipped})\n· 신규 ${num(r.ingest.upserted)} / 갱신 ${num(r.ingest.modified)}\n· 매칭가능(010) ${num(r.stats.phoneMobile)} · 안심번호 ${r.stats.phoneSafe} · 연락처없음 ${r.stats.phoneEmpty}`, true);
      loadStats();
    } else showMsg('❌ ' + r.message, false);
  } catch (e) { showMsg('❌ ' + e.message, false); }
  btn.disabled = false; btn.textContent = '🔄 data.xlsx 동기화';
}

async function doUpload(input) {
  if (!input.files[0]) return;
  const fd = new FormData(); fd.append('file', input.files[0]);
  showMsg('업로드 적재 중...', true);
  try {
    const r = await jsonFetch(API + '/api/erp/upload', { method:'POST', body:fd });
    if (r.success) { showMsg(`✅ 업로드 적재 완료 · 신규 ${num(r.ingest.upserted)} / 갱신 ${num(r.ingest.modified)}`, true); loadStats(); }
    else showMsg('❌ ' + r.message, false);
  } catch (e) { showMsg('❌ ' + e.message, false); }
  input.value = '';
}

async function loadSales(page) {
  const name = $('q-name').value.trim(); const phone = $('q-phone').value.trim();
  const qs = new URLSearchParams({ page: page||1, limit: 100 });
  if (name) qs.set('name', name); if (phone) qs.set('phone', phone);
  const tbody = $('rows'); tbody.innerHTML = '<tr><td colspan="11" class="muted" style="text-align:center;padding:22px">불러오는 중...</td></tr>';
  try {
    const r = await jsonFetch(API + '/api/erp/sales?' + qs);
    if (!r.success || !r.items.length) { tbody.innerHTML = '<tr><td colspan="11" class="muted" style="text-align:center;padding:22px">결과 없음</td></tr>'; return; }
    tbody.innerHTML = r.items.map(x => `<tr>
      <td>${x.saleDateStr||'-'}</td><td>${x.orderKey||'-'}</td><td>${x.channel||'-'}</td>
      <td>${x.productCode||'-'}</td><td>${x.productName||'-'}</td><td>${x.spec||'-'}</td>
      <td>${num(x.qty)}</td><td>${num(x.amount)}</td><td>${x.customerName||'-'}</td>
      <td>${x.phoneRaw||'-'}</td><td><span class="pill ${x.phoneType}">${x.phoneType}</span></td>
    </tr>`).join('');
  } catch (e) { tbody.innerHTML = '<tr><td colspan="11" style="color:var(--bad);padding:22px;text-align:center">'+e.message+'</td></tr>'; }
}

loadStats();
</script>
</body>
</html>
