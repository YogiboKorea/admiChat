<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>요기보 정품인증</title>
  <style>
    :root {
      --bg:#f2f4f6; --card:#fff; --primary:#3182f6; --primary-d:#1b64da;
      --txt:#191f28; --txt2:#4e5968; --txt3:#8b95a1; --line:#e5e8eb;
      --ok:#00c471; --warn:#ff9500; --bad:#f04452;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--txt);
      font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Segoe UI',sans-serif;
      -webkit-font-smoothing:antialiased; }
    .wrap { max-width:480px; margin:0 auto; padding:24px 20px 80px; }
    .head { padding:8px 0 20px; }
    .head h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; margin:0 0 6px; }
    .head p { color:var(--txt2); font-size:14px; margin:0; line-height:1.5; }

    .search { display:flex; gap:8px; margin-bottom:16px; }
    .search input { flex:1; border:none; background:var(--card); border-radius:14px; padding:16px; font-size:16px; color:var(--txt); box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .search input:focus { outline:2px solid var(--primary); }
    .btn { border:none; border-radius:14px; font-weight:700; cursor:pointer; font-size:16px; transition:.15s; font-family:inherit; }
    .btn-primary { background:var(--primary); color:#fff; padding:16px 20px; }
    .btn-primary:active { background:var(--primary-d); transform:scale(.98); }
    .btn-primary:disabled { background:#c9d1da; cursor:not-allowed; }
    .btn-full { width:100%; margin-top:16px; padding:15px; }

    .member { background:var(--card); border-radius:18px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .member .hi { font-size:19px; font-weight:800; }
    .member .sub { color:var(--txt3); font-size:13px; margin-top:5px; }

    .banner { border-radius:14px; padding:15px 16px; font-size:14px; margin-bottom:14px; display:none; line-height:1.5; }
    .banner.show { display:block; }
    .banner.warn { background:#fff4e6; color:#b45309; }
    .banner.err { background:#fde8ea; color:#c0303c; }

    .card { background:var(--card); border-radius:18px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .card .pname { font-size:17px; font-weight:800; letter-spacing:-0.3px; }
    .card .pspec { color:var(--txt2); font-size:14px; margin-top:4px; }
    .meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .chip { background:#f2f4f6; color:var(--txt2); font-size:12.5px; font-weight:600; padding:6px 11px; border-radius:9px; }
    .warrbox { margin-top:16px; background:#eef5ff; border-radius:12px; padding:14px 16px; font-size:14px; color:var(--txt2); }
    .warrbox b { color:var(--primary-d); font-weight:800; }
    .warrbox.done { background:#e7f9f1; }
    .warrbox.done b { color:#00a35f; }

    .pill { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:20px; }
    .pill.ok { background:#e7f9f1; color:#00a35f; }
    .pill.promo { background:#fff4e6; color:#d97706; }
    .btn-ghost { width:100%; margin-top:12px; padding:14px; background:#f2f4f6; color:var(--txt); }
    .btn-ghost:active { background:#e5e8eb; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }

    .empty { text-align:center; color:var(--txt3); padding:48px 0; font-size:15px; }
    .spin { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:s .7s linear infinite; vertical-align:-3px; margin-right:7px; }
    @keyframes s { to { transform:rotate(360deg); } }

    /* ===== 정품인증서 모달 ===== */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; }
    .overlay.show { display:flex; animation:fade .2s; }
    @keyframes fade { from { opacity:0; } }
    .cert { background:#fff; border-radius:24px; max-width:400px; width:100%; overflow:hidden; animation:pop .25s cubic-bezier(.2,.9,.3,1.2); box-shadow:0 20px 60px rgba(0,0,0,.3); }
    @keyframes pop { from { transform:scale(.9); opacity:0; } }
    .cert-top { background:linear-gradient(135deg,#3182f6,#1b64da); color:#fff; padding:30px 26px 26px; text-align:center; }
    .cert-seal { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:32px; }
    .cert-top .t1 { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
    .cert-top .t2 { font-size:12px; opacity:.85; margin-top:3px; letter-spacing:1px; }
    .cert-no { background:rgba(255,255,255,.15); border-radius:12px; padding:12px; margin-top:18px; }
    .cert-no .lbl { font-size:11px; opacity:.85; }
    .cert-no .val { font-size:22px; font-weight:800; font-family:'SF Mono',monospace; letter-spacing:1.5px; margin-top:3px; }
    .cert-body { padding:22px 26px 26px; }
    .cert-row { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .cert-row:last-of-type { border-bottom:none; }
    .cert-row .k { color:var(--txt3); }
    .cert-row .v { color:var(--txt); font-weight:700; text-align:right; max-width:60%; }
    .cert-foot { text-align:center; color:var(--txt3); font-size:12px; margin-top:14px; line-height:1.5; }
    .cert-badge { display:inline-block; background:#e7f9f1; color:#00a35f; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:20px; margin-top:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>요기보 정품인증</h1>
      <p>구매하신 제품을 정품인증하면 보증기간이 연장됩니다.<br/>기본 1년 · 프로모션 기간 인증 시 1년 6개월</p>
    </div>

    <div id="banner" class="banner"></div>
    <div id="authState"></div>
    <div id="member"></div>
    <div id="list"></div>
  </div>

  <!-- 정품인증서 모달 -->
  <div class="overlay" id="overlay" onclick="if(event.target===this)closeCert()">
    <div class="cert" id="cert"></div>
  </div>

<script>
const ADMIN_SERVER = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app';
const API = (location.origin === ADMIN_SERVER || location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : ADMIN_SERVER;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));
function banner(text, type) { const b = $('banner'); if (!text) { b.className='banner'; return; } b.textContent = text; b.className = 'banner show ' + (type||'warn'); }

async function jsonFetch(url, opts) {
  const r = await fetch(url, opts);
  const t = await r.text();
  if (!t) throw new Error('서버 응답이 비어 있습니다. (' + r.status + ')');
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('서버 응답 형식 오류 (' + r.status + ')'); }
  return j;
}

// ===== Cafe24 로그인 회원 자동 조회 (룰렛 이벤트와 동일 방식) =====
const CAFE24_APP_KEY = 'R4as6neTNyXXjVfpfUj9lE';
const LOGIN_BASE = '/member/login.html';
let cafeRetry = 0;
let currentMember = null;
let itemsCache = {};

window.addEventListener('DOMContentLoaded', () => {
  // 테스트/직접접근용: ?memberId= 있으면 그걸로
  const q = new URLSearchParams(location.search).get('memberId');
  if (q) { lookup(q); return; }
  setAuthState('<div class="member"><div class="hi">회원 정보를 확인하고 있어요...</div></div>');
  initCafe24();
});

function setAuthState(html) { $('authState').innerHTML = html || ''; }

function initCafe24() {
  if (typeof CAFE24API === 'undefined') {
    if (cafeRetry++ < 10) { setTimeout(initCafe24, 500); return; }
    showLogin(); return;
  }
  try {
    CAFE24API.init(CAFE24_APP_KEY);
    CAFE24API.getMemberID(function (res) {
      if (res && res !== 'GUEST') { setAuthState(''); lookup(res); }
      else if (cafeRetry++ < 5) { setTimeout(initCafe24, 500); }
      else { showLogin(); }
    });
  } catch (e) { showLogin(); }
}

function showLogin() {
  setAuthState(`<div class="member" style="text-align:center">
    <div class="hi">로그인이 필요해요</div>
    <div class="sub" style="margin:8px 0 18px;line-height:1.5">로그인하면 구매하신 제품을 자동으로 불러와<br/>정품인증할 수 있어요.</div>
    <button class="btn btn-primary btn-full" style="margin-top:0" onclick="goLogin()">로그인하기</button>
  </div>`);
}
function goLogin() {
  const ret = location.pathname + location.search + location.hash;
  location.href = LOGIN_BASE + '?returnUrl=' + encodeURIComponent(ret);
}

async function lookup(memberId) {
  memberId = String(memberId || '').trim();
  if (!memberId) { showLogin(); return; }
  banner(''); setAuthState(''); $('member').innerHTML = ''; currentMember = memberId; itemsCache = {};
  $('list').innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    const r = await jsonFetch(API + '/api/warranty/lookup?memberId=' + encodeURIComponent(memberId));
    if (!r.success) { banner(r.message || '조회에 실패했어요.', 'err'); $('list').innerHTML = ''; return; }
    $('member').innerHTML = `<div class="member"><div class="hi">${esc(r.member.name)} 님</div><div class="sub">${esc(r.member.memberId)} · ${esc(r.member.phone)}</div></div>`;
    if (!r.member.matchable) banner('가입하신 휴대폰번호(010)가 확인되지 않아 자동 정품인증이 어렵습니다. 고객센터로 문의해 주세요.', 'warn');
    r.items.forEach(it => itemsCache[it.rowHash] = it);
    renderList(r.items);
  } catch (e) { banner(e.message, 'err'); $('list').innerHTML = ''; }
}

function renderList(items) {
  if (!items || !items.length) { $('list').innerHTML = '<div class="empty">매칭되는 구매 제품이 없어요.</div>'; return; }
  $('list').innerHTML = items.map(it => {
    const done = it.authorized;
    const promo = it.preview.promotion;
    const warr = done
      ? `<div class="warrbox done">정품인증 완료 · 보증 <b>${done.months}개월</b> · 만료 <b>${done.endDate}</b></div>`
      : `<div class="warrbox">예상 보증 <b>${it.preview.months}개월</b> · 만료 <b>${it.preview.endDate}</b>${promo?` <span class="pill promo">${esc(promo.name||'프로모션')}</span>`:''}</div>`;
    const action = done
      ? `<button class="btn btn-ghost" onclick="showCert('${it.rowHash}')">정품인증서 보기</button>`
      : `<button class="btn btn-primary btn-full" onclick="authOne('${it.rowHash}', this)">이 제품 정품인증하기</button>`;
    return `<div class="card">
      <div class="top">
        <div><div class="pname">${esc(it.productName)}</div><div class="pspec">${esc(it.spec)}</div></div>
        ${done?'<span class="pill ok">인증완료</span>':''}
      </div>
      <div class="meta"><span class="chip">구매일 ${esc(it.saleDateStr)}</span><span class="chip">${esc(it.channel)}</span><span class="chip">수량 ${it.qty}</span></div>
      ${warr}${action}
    </div>`;
  }).join('');
}

async function authOne(rowHash, btnEl) {
  if (!currentMember) return;
  btnEl.disabled = true; btnEl.innerHTML = '<span class="spin"></span>인증 처리중';
  try {
    const r = await jsonFetch(API + '/api/warranty/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ memberId: currentMember, rowHashes: [rowHash] })
    });
    if (!r.success || !r.results || !r.results[0] || !r.results[0].ok) {
      banner((r.results && r.results[0] && r.results[0].reason) || r.message || '인증에 실패했어요.', 'err');
      btnEl.disabled = false; btnEl.textContent = '이 제품 정품인증하기'; return;
    }
    const res = r.results[0];
    const it = itemsCache[rowHash] || {};
    // 인증서 팝업 발급
    openCert({
      certNo: res.certNo,
      productName: it.productName, spec: it.spec, saleDateStr: it.saleDateStr,
      months: res.months, endDate: res.endDate, promotionName: res.promotionName,
      authAt: new Date().toISOString(),
      fresh: !res.alreadyAuthed,
    });
    lookup(currentMember); // 목록 갱신(백그라운드)
  } catch (e) { banner(e.message, 'err'); btnEl.disabled = false; btnEl.textContent = '이 제품 정품인증하기'; }
}

// 이미 인증된 제품의 인증서 다시 보기
function showCert(rowHash) {
  const it = itemsCache[rowHash]; if (!it || !it.authorized) return;
  openCert({
    certNo: it.authorized.certNo,
    productName: it.productName, spec: it.spec, saleDateStr: it.saleDateStr,
    months: it.authorized.months, endDate: it.authorized.endDate,
    promotionName: null, authAt: it.authorized.at, fresh: false,
  });
}

function openCert(c) {
  const authDate = c.authAt ? new Date(c.authAt).toLocaleDateString('ko-KR') : '-';
  $('cert').innerHTML = `
    <div class="cert-top">
      <div class="cert-seal">✓</div>
      <div class="t1">요기보 정품인증서</div>
      <div class="t2">CERTIFICATE OF AUTHENTICITY</div>
      <div class="cert-no"><div class="lbl">인증번호</div><div class="val">${esc(c.certNo)}</div></div>
    </div>
    <div class="cert-body">
      <div class="cert-row"><span class="k">제품</span><span class="v">${esc(c.productName)}</span></div>
      <div class="cert-row"><span class="k">규격</span><span class="v">${esc(c.spec)}</span></div>
      <div class="cert-row"><span class="k">구매일</span><span class="v">${esc(c.saleDateStr)}</span></div>
      <div class="cert-row"><span class="k">인증일</span><span class="v">${authDate}</span></div>
      <div class="cert-row"><span class="k">보증기간</span><span class="v">${c.months}개월</span></div>
      <div class="cert-row"><span class="k">보증만료</span><span class="v">${esc(c.endDate)}</span></div>
      <div style="text-align:center">
        <span class="cert-badge">✓ 정품으로 인증되었습니다</span>
        ${c.promotionName?`<div style="margin-top:8px"><span class="pill promo">${esc(c.promotionName)} 적용</span></div>`:''}
      </div>
      <div class="cert-foot">본 인증서의 인증번호는 A/S 접수 시 필요합니다.<br/>화면을 캡처해 보관해 주세요.</div>
      <button class="btn btn-primary btn-full" onclick="closeCert()">확인</button>
    </div>`;
  $('overlay').classList.add('show');
}
function closeCert() { $('overlay').classList.remove('show'); }
</script>
</body>
</html>
