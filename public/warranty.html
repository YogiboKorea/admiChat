<!--@layout(/layout/basic/layout.html)-->
<style type="text/css">
  .yw-wrap { max-width:480px; margin:0 auto; padding:24px 20px 80px; color:#191f28;
    font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; box-sizing:border-box; }
  .yw-wrap *, .yw-overlay * { box-sizing:border-box; }
  .yw-head { padding:8px 0 20px; }
  .yw-head h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; margin:0 0 6px; color:#191f28; }
  .yw-head p { color:#4e5968; font-size:14px; margin:0; line-height:1.5; }
  .yw-btn { border:none; border-radius:14px; font-weight:700; cursor:pointer; font-size:16px; font-family:inherit; transition:.15s; }
  .yw-btn-primary { background:#3182f6; color:#fff; padding:16px 20px; }
  .yw-btn-primary:active { background:#1b64da; transform:scale(.98); }
  .yw-btn-full { width:100%; margin-top:16px; padding:15px; }
  .yw-btn-ghost { width:100%; margin-top:12px; padding:14px; background:#f2f4f6; color:#191f28; }
  .yw-member { background:#fff; border-radius:18px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid #eef0f2; }
  .yw-member .yw-hi { font-size:19px; font-weight:800; color:#191f28; }
  .yw-member .yw-sub { color:#8b95a1; font-size:13px; margin-top:5px; }
  .yw-banner { border-radius:14px; padding:15px 16px; font-size:14px; margin-bottom:14px; display:none; line-height:1.5; }
  .yw-banner.yw-show { display:block; }
  .yw-banner.yw-warn { background:#fff4e6; color:#b45309; }
  .yw-banner.yw-err { background:#fde8ea; color:#c0303c; }
  .yw-card { background:#fff; border-radius:18px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid #eef0f2; }
  .yw-card .yw-pname { font-size:17px; font-weight:800; letter-spacing:-0.3px; color:#191f28; }
  .yw-card .yw-pspec { color:#4e5968; font-size:14px; margin-top:4px; }
  .yw-meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .yw-chip { background:#f2f4f6; color:#4e5968; font-size:12.5px; font-weight:600; padding:6px 11px; border-radius:9px; }
  .yw-warrbox { margin-top:16px; background:#eef5ff; border-radius:12px; padding:14px 16px; font-size:14px; color:#4e5968; }
  .yw-warrbox b { color:#1b64da; font-weight:800; }
  .yw-warrbox.yw-done { background:#e7f9f1; }
  .yw-warrbox.yw-done b { color:#00a35f; }
  .yw-pill { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:20px; }
  .yw-pill.yw-ok { background:#e7f9f1; color:#00a35f; }
  .yw-pill.yw-promo { background:#fff4e6; color:#d97706; }
  .yw-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .yw-empty { text-align:center; color:#8b95a1; padding:48px 0; font-size:15px; }
  .yw-spin { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:yw-s .7s linear infinite; vertical-align:-3px; margin-right:7px; }
  @keyframes yw-s { to { transform:rotate(360deg); } }
  /* 정품인증서 모달 */
  .yw-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:99999; }
  .yw-overlay.yw-show { display:flex; }
  .yw-cert { background:#fff; border-radius:24px; max-width:400px; width:100%; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3);
    font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; }
  .yw-cert-top { background:linear-gradient(135deg,#3182f6,#1b64da); color:#fff; padding:30px 26px 26px; text-align:center; }
  .yw-cert-seal { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:32px; }
  .yw-cert-top .yw-t1 { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
  .yw-cert-top .yw-t2 { font-size:12px; opacity:.85; margin-top:3px; letter-spacing:1px; }
  .yw-cert-no { background:rgba(255,255,255,.15); border-radius:12px; padding:12px; margin-top:18px; }
  .yw-cert-no .yw-lbl { font-size:11px; opacity:.85; }
  .yw-cert-no .yw-val { font-size:22px; font-weight:800; font-family:'SF Mono',monospace; letter-spacing:1.5px; margin-top:3px; }
  .yw-cert-body { padding:22px 26px 26px; }
  .yw-cert-row { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #e5e8eb; font-size:14px; }
  .yw-cert-row:last-of-type { border-bottom:none; }
  .yw-cert-row .yw-k { color:#8b95a1; }
  .yw-cert-row .yw-v { color:#191f28; font-weight:700; text-align:right; max-width:60%; }
  .yw-cert-foot { text-align:center; color:#8b95a1; font-size:12px; margin-top:14px; line-height:1.5; }
  .yw-cert-badge { display:inline-block; background:#e7f9f1; color:#00a35f; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:20px; margin-top:14px; }
</style>

<div class="yw-wrap">
  <div class="yw-head">
    <h1>요기보 정품인증</h1>
    <p>구매하신 제품을 정품인증하면 보증기간이 연장됩니다.<br/>기본 1년 · 프로모션 기간 인증 시 1년 6개월</p>
  </div>
  <div id="yw-banner" class="yw-banner"></div>
  <div id="yw-authState"></div>
  <div id="yw-member"></div>
  <div id="yw-list"></div>

  <!-- 정품인증서 모달 -->
  <div class="yw-overlay" id="yw-overlay">
    <div class="yw-cert" id="yw-cert"></div>
  </div>
</div>

<script>
(function () {
  // ===== 설정 =====
  var CAFE24_APP_KEY = 'R4as6neTNyXXjVfpfUj9lE';
  var ADMIN_SERVER = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app';
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.origin === ADMIN_SERVER) ? '' : ADMIN_SERVER;
  var LOGIN_BASE = '/member/login.html';

  var sdkRetry = 0, idRetry = 0, currentMember = null, itemsCache = {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<':'&lt;','>':'&gt;','&':'&amp;' }[c]; }); };

  function banner(text, type) { var b = $('yw-banner'); if (!text) { b.className = 'yw-banner'; return; } b.textContent = text; b.className = 'yw-banner yw-show yw-' + (type || 'warn'); }
  function setAuthState(html) { $('yw-authState').innerHTML = html || ''; }

  function jsonFetch(url, opts) {
    return fetch(url, opts).then(function (r) {
      return r.text().then(function (t) {
        if (!t) throw new Error('서버 응답이 비어 있습니다. (' + r.status + ')');
        try { return JSON.parse(t); } catch (e) { throw new Error('서버 응답 형식 오류 (' + r.status + ')'); }
      });
    });
  }

  // ===== 회원 아이디 취득 (Cafe24 스토어프론트 SDK — 이벤트 페이지와 동일) =====
  document.addEventListener('DOMContentLoaded', function () {
    var q = new URLSearchParams(location.search).get('memberId');
    if (q) { console.log('[정품인증] ?memberId=', q); lookup(q); return; }
    setAuthState('<div class="yw-member"><div class="yw-hi">회원 정보를 확인하고 있어요...</div></div>');
    initMember();
  });

  function initMember() {
    if (typeof CAFE24API === 'undefined') {
      if (sdkRetry++ < 20) { setTimeout(initMember, 500); return; }
      console.warn('[정품인증] CAFE24API 로드 실패');
      showLogin(); return;
    }
    try {
      CAFE24API.init(CAFE24_APP_KEY);
      CAFE24API.getMemberID(function (res) {
        console.log('[정품인증] getMemberID:', JSON.stringify(res));
        if (res && res !== 'GUEST') { setAuthState(''); lookup(res); }
        else if (idRetry++ < 5) { setTimeout(initMember, 500); }
        else { showLogin(); }
      });
    } catch (err) { console.error('[정품인증] CAFE24API 오류:', err); showLogin(); }
  }

  function showLogin() {
    setAuthState('<div class="yw-member" style="text-align:center">'
      + '<div class="yw-hi">로그인이 필요해요</div>'
      + '<div class="yw-sub" style="margin:8px 0 18px;line-height:1.5">로그인하면 구매하신 제품을 자동으로 불러와<br/>정품인증할 수 있어요.</div>'
      + '<button class="yw-btn yw-btn-primary yw-btn-full" style="margin-top:0" onclick="__ywGoLogin()">로그인하기</button></div>');
  }
  window.__ywGoLogin = function () {
    var ret = location.pathname + location.search + location.hash;
    location.href = LOGIN_BASE + '?returnUrl=' + encodeURIComponent(ret);
  };

  function lookup(memberId) {
    memberId = String(memberId || '').trim();
    if (!memberId) { showLogin(); return; }
    banner(''); setAuthState(''); $('yw-member').innerHTML = ''; currentMember = memberId; itemsCache = {};
    console.log('[정품인증] 📤 lookup memberId =', JSON.stringify(memberId));
    $('yw-list').innerHTML = '<div class="yw-empty">불러오는 중...</div>';
    jsonFetch(API + '/api/warranty/lookup?memberId=' + encodeURIComponent(memberId)).then(function (r) {
      if (!r.success) { console.warn('[정품인증] lookup 실패:', r); banner(r.message || '조회에 실패했어요.', 'err'); $('yw-list').innerHTML = ''; return; }
      $('yw-member').innerHTML = '<div class="yw-member"><div class="yw-hi">' + esc(r.member.name) + ' 님</div><div class="yw-sub">' + esc(r.member.memberId) + ' · ' + esc(r.member.phone) + '</div></div>';
      if (!r.member.matchable) banner('가입하신 휴대폰번호(010)가 확인되지 않아 자동 정품인증이 어렵습니다. 고객센터로 문의해 주세요.', 'warn');
      r.items.forEach(function (it) { itemsCache[it.rowHash] = it; });
      renderList(r.items);
    }).catch(function (e) { banner(e.message, 'err'); $('yw-list').innerHTML = ''; });
  }

  function renderList(items) {
    if (!items || !items.length) { $('yw-list').innerHTML = '<div class="yw-empty">매칭되는 구매 제품이 없어요.</div>'; return; }
    $('yw-list').innerHTML = items.map(function (it) {
      var done = it.authorized;
      var promo = it.preview.promotion;
      var warr = done
        ? '<div class="yw-warrbox yw-done">정품인증 완료 · 보증 <b>' + done.months + '개월</b> · 만료 <b>' + done.endDate + '</b></div>'
        : '<div class="yw-warrbox">예상 보증 <b>' + it.preview.months + '개월</b> · 만료 <b>' + it.preview.endDate + '</b>' + (promo ? ' <span class="yw-pill yw-promo">' + esc(promo.name || '프로모션') + '</span>' : '') + '</div>';
      var action = done
        ? '<button class="yw-btn yw-btn-ghost" onclick="__ywShowCert(\'' + it.rowHash + '\')">정품인증서 보기</button>'
        : '<button class="yw-btn yw-btn-primary yw-btn-full" onclick="__ywAuth(\'' + it.rowHash + '\', this)">이 제품 정품인증하기</button>';
      return '<div class="yw-card"><div class="yw-top"><div><div class="yw-pname">' + esc(it.productName) + '</div><div class="yw-pspec">' + esc(it.spec) + '</div></div>'
        + (done ? '<span class="yw-pill yw-ok">인증완료</span>' : '') + '</div>'
        + '<div class="yw-meta"><span class="yw-chip">구매일 ' + esc(it.saleDateStr) + '</span><span class="yw-chip">' + esc(it.channel) + '</span><span class="yw-chip">수량 ' + it.qty + '</span></div>'
        + warr + action + '</div>';
    }).join('');
  }

  window.__ywAuth = function (rowHash, btnEl) {
    if (!currentMember) return;
    btnEl.disabled = true; btnEl.innerHTML = '<span class="yw-spin"></span>인증 처리중';
    jsonFetch(API + '/api/warranty/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ memberId: currentMember, rowHashes: [rowHash] })
    }).then(function (r) {
      if (!r.success || !r.results || !r.results[0] || !r.results[0].ok) {
        banner((r.results && r.results[0] && r.results[0].reason) || r.message || '인증에 실패했어요.', 'err');
        btnEl.disabled = false; btnEl.textContent = '이 제품 정품인증하기'; return;
      }
      var res = r.results[0]; var it = itemsCache[rowHash] || {};
      openCert({ certNo: res.certNo, productName: it.productName, spec: it.spec, saleDateStr: it.saleDateStr, months: res.months, endDate: res.endDate, promotionName: res.promotionName, authAt: new Date().toISOString() });
      lookup(currentMember);
    }).catch(function (e) { banner(e.message, 'err'); btnEl.disabled = false; btnEl.textContent = '이 제품 정품인증하기'; });
  };

  window.__ywShowCert = function (rowHash) {
    var it = itemsCache[rowHash]; if (!it || !it.authorized) return;
    openCert({ certNo: it.authorized.certNo, productName: it.productName, spec: it.spec, saleDateStr: it.saleDateStr, months: it.authorized.months, endDate: it.authorized.endDate, promotionName: null, authAt: it.authorized.at });
  };

  function openCert(c) {
    var authDate = c.authAt ? new Date(c.authAt).toLocaleDateString('ko-KR') : '-';
    $('yw-cert').innerHTML = ''
      + '<div class="yw-cert-top"><div class="yw-cert-seal">✓</div><div class="yw-t1">요기보 정품인증서</div><div class="yw-t2">CERTIFICATE OF AUTHENTICITY</div>'
      + '<div class="yw-cert-no"><div class="yw-lbl">인증번호</div><div class="yw-val">' + esc(c.certNo) + '</div></div></div>'
      + '<div class="yw-cert-body">'
      + '<div class="yw-cert-row"><span class="yw-k">제품</span><span class="yw-v">' + esc(c.productName) + '</span></div>'
      + '<div class="yw-cert-row"><span class="yw-k">규격</span><span class="yw-v">' + esc(c.spec) + '</span></div>'
      + '<div class="yw-cert-row"><span class="yw-k">구매일</span><span class="yw-v">' + esc(c.saleDateStr) + '</span></div>'
      + '<div class="yw-cert-row"><span class="yw-k">인증일</span><span class="yw-v">' + authDate + '</span></div>'
      + '<div class="yw-cert-row"><span class="yw-k">보증기간</span><span class="yw-v">' + c.months + '개월</span></div>'
      + '<div class="yw-cert-row"><span class="yw-k">보증만료</span><span class="yw-v">' + esc(c.endDate) + '</span></div>'
      + '<div style="text-align:center"><span class="yw-cert-badge">✓ 정품으로 인증되었습니다</span>'
      + (c.promotionName ? '<div style="margin-top:8px"><span class="yw-pill yw-promo">' + esc(c.promotionName) + ' 적용</span></div>' : '') + '</div>'
      + '<div class="yw-cert-foot">본 인증서의 인증번호는 A/S 접수 시 필요합니다.<br/>화면을 캡처해 보관해 주세요.</div>'
      + '<button class="yw-btn yw-btn-primary yw-btn-full" onclick="__ywCloseCert()">확인</button></div>';
    $('yw-overlay').classList.add('yw-show');
  }
  window.__ywCloseCert = function () { $('yw-overlay').classList.remove('yw-show'); };
  $('yw-overlay') && ($('yw-overlay').onclick = function (e) { if (e.target === this) window.__ywCloseCert(); });
})();
</script>
