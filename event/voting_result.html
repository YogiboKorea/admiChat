<style type="text/css">
    body {
        margin: 0;
        padding: 0;
        background-color: #111;
    }

    .voting_result {
        width: 100%;
        min-width: 320px;
        max-width: 660px;
        margin: 0 auto;
        font-family: 'Noto Sans KR', sans-serif;
        background: radial-gradient(circle at 50% 100%, #2a2e3d, #080a0f);
        min-height: 100vh;
        padding: 60px 20px;
        box-sizing: border-box;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    /* 스포트라이트 효과 */
    .spotlight {
        position: absolute;
        bottom: -50px;
        width: 200px;
        height: 500px;
        background: radial-gradient(ellipse at bottom, rgba(255,255,255,0.15) 0%, transparent 60%);
        z-index: 1;
        pointer-events: none;
    }
    .spotlight.left {
        left: -100px;
        transform: rotate(35deg);
        transform-origin: bottom center;
    }
    .spotlight.right {
        right: -100px;
        transform: rotate(-35deg);
        transform-origin: bottom center;
    }

    .ranking-title {
        color: #fff;
        font-size: clamp(24px, 6vw, 32px);
        font-weight: 800;
        margin-bottom: 60px;
        position: relative;
        z-index: 10;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .ranking-title .fire {
        display: inline-block;
        animation: fireBob 1s infinite alternate ease-in-out;
    }

    @keyframes fireBob {
        from { transform: translateY(0); }
        to { transform: translateY(-4px); }
    }

    .podium-wrap {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: clamp(10px, 3vw, 20px);
        position: relative;
        z-index: 10;
        padding-bottom: 40px; 
    }

    .rank-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        width: 30%;
        max-width: 140px;
        border-radius: 12px;
        padding: 15px 10px;
        box-sizing: border-box;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    /* 2등 */
    .rank-2 {
        background: #4A4D54;
        border: 1px solid #7D828A;
        margin-bottom: 30px; 
    }
    /* 1등 */
    .rank-1 {
        background: #755030;
        border: 2px solid #D49D37;
        width: 35%;
        max-width: 160px;
        padding: 20px 10px;
        z-index: 2;
    }
    /* 3등 */
    .rank-3 {
        background: #382A24;
        border: 1px solid #634533;
        margin-bottom: 15px; 
    }

    /* 왕관 */
    .crown {
        position: absolute;
        top: -35px;
        width: 45px;
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-weight: 900;
        font-size: 14px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        padding-top: 6px;
        box-sizing: border-box;
    }
    .crown svg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
    }
    
    .rank-1 .crown {
        top: -45px;
        width: 60px;
        height: 60px;
        font-size: 18px;
        padding-top: 8px;
    }

    /* 이미지 동그라미 */
    .img-box {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        background: #fff;
        margin-bottom: 12px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.2);
    }
    .img-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* 상품명 */
    .prod-name {
        color: #fff;
        font-size: clamp(12px, 3.5vw, 15px);
        font-weight: 700;
        text-align: center;
        word-break: keep-all;
    }
    .rank-1 .prod-name {
        font-size: clamp(14px, 4vw, 18px);
    }

    /* 단상 실린더 형태 */
    .podium-cylinder {
        position: absolute;
        bottom: -50px;
        left: 50%;
        transform: translateX(-50%);
        width: 150%;
        height: 300px;
        background: #141c2e;
        border-radius: 50% / 40px;
        z-index: 5;
        box-shadow: inset 0 20px 50px rgba(0,0,0,0.8);
    }
    .podium-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background: radial-gradient(ellipse at center, #2e3e5c, #1a243b);
        border-radius: 50%;
        box-shadow: inset 0 -5px 15px rgba(0,0,0,0.4);
    }

    /* 데이터 로딩 전 처리 */
    .loading-wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-weight: bold;
        z-index: 20;
    }

</style>

<div class="voting_result">
    <div class="spotlight left"></div>
    <div class="spotlight right"></div>

    <div id="loading-wrap" class="loading-wrap">
        실시간 랭킹 데이터를 불러오는 중입니다...
    </div>

    <div id="ranking-content" style="display: none;">
        <h2 class="ranking-title"><span class="fire">🔥</span>실시간 랭킹 현황<span class="fire">🔥</span></h2>
        
        <div class="podium-wrap">
            <!-- 2등 -->
            <div class="rank-item rank-2" id="rank-2-item" style="visibility: hidden;">
                <div class="crown">
                    2
                    <svg viewBox="0 0 24 24" fill="#C0C0C0" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 19h20v2H2v-2zm1.6-3L5 6l4.5 4 2.5-6 2.5 6 4.5-4 1.4 10H3.6z"/>
                    </svg>
                </div>
                <div class="img-box">
                    <img id="rank-2-img" src="" alt="2등">
                </div>
                <div class="prod-name" id="rank-2-name"></div>
            </div>
            
            <!-- 1등 -->
            <div class="rank-item rank-1" id="rank-1-item" style="visibility: hidden;">
                <div class="crown">
                    1
                    <svg viewBox="0 0 24 24" fill="#FFB700" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 19h20v2H2v-2zm1.6-3L5 6l4.5 4 2.5-6 2.5 6 4.5-4 1.4 10H3.6z"/>
                    </svg>
                </div>
                <div class="img-box">
                    <img id="rank-1-img" src="" alt="1등">
                </div>
                <div class="prod-name" id="rank-1-name"></div>
            </div>
            
            <!-- 3등 -->
            <div class="rank-item rank-3" id="rank-3-item" style="visibility: hidden;">
                <div class="crown">
                    3
                    <svg viewBox="0 0 24 24" fill="#CD7F32" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 19h20v2H2v-2zm1.6-3L5 6l4.5 4 2.5-6 2.5 6 4.5-4 1.4 10H3.6z"/>
                    </svg>
                </div>
                <div class="img-box">
                    <img id="rank-3-img" src="" alt="3등">
                </div>
                <div class="prod-name" id="rank-3-name"></div>
            </div>
        </div>

        <div class="podium-cylinder">
            <div class="podium-top"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app';
    
    // 상품별 이미지 매핑 정보
    const PRODUCT_IMAGES = {
        '맥스': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_맥스.png',
        '더블': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_더블.png',
        '서포트': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_서포트.png',
        '슬림': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_슬림.png',
        '미니': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_미니.png',
        '드롭': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_드롭.png',
        '라운저': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_라운저.png',
        '피라미드': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_피라미드.png',
        '라운드필로우': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_라운드필로우.png',
        '메이트': 'https://yogibo.openhost.cafe24.com//web/img/event/0713/Icon_메이트.png'
    };

    // 상품별 기본 이름 매핑 정보
    const PRODUCT_NAMES = {
        '맥스': '맥스',
        '더블': '더블',
        '서포트': '서포트',
        '슬림': '슬림',
        '미니': '미니',
        '드롭': '드롭',
        '라운저': '라운저',
        '피라미드': '피라미드',
        '라운드필로우': '라운드 필로우',
        '메이트': '메이트'
    };

    document.addEventListener('DOMContentLoaded', function() {
        loadRankingData();
    });

    function loadRankingData() {
        fetch(API_BASE_URL + '/api/vote/status')
            .then(res => res.json())
            .then(res => {
                document.getElementById('loading-wrap').style.display = 'none';
                document.getElementById('ranking-content').style.display = 'block';

                // 데이터 없는 순위 카드는 처음부터 숨김
                [1, 2, 3].forEach(r => {
                    document.getElementById('rank-' + r + '-item').style.display = 'none';
                });

                if (res.success && res.data && res.data.length > 0) {
                    const sortedData = res.data.sort((a, b) => b.count - a.count);

                    // 있는 순위만 렌더링 (최대 3위)
                    sortedData.slice(0, 3).forEach((item, idx) => {
                        renderRank(idx + 1, item.productId);
                    });
                }
            })
            .catch(err => {
                console.error('랭킹 데이터 로드 실패:', err);
                document.getElementById('loading-wrap').innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
            });
    }

    function renderRank(rank, productId) {
        const itemEl = document.getElementById('rank-' + rank + '-item');
        const imgEl = document.getElementById('rank-' + rank + '-img');
        const nameEl = document.getElementById('rank-' + rank + '-name');
        
        if (itemEl && imgEl && nameEl) {
            imgEl.src = PRODUCT_IMAGES[productId] || '';
            nameEl.innerText = PRODUCT_NAMES[productId] || productId;
            itemEl.style.display = 'flex';
            itemEl.style.visibility = 'visible';
            
            itemEl.animate([
                { opacity: 0, transform: 'translateY(20px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], {
                duration: 600,
                delay: rank * 150,
                fill: 'forwards',
                easing: 'ease-out'
            });
        }
    }
</script>
