<style type="text/css">
    html, body {
        background-color: #f4f5f9;
    }

    .yw-wrap {
        max-width: 600px;
        margin: 0 auto;
        padding: 24px 20px 80px;
        background-color: #f4f5f9;
        color: #090909;
        font-family: 'Pretendard', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
        min-height: 100vh;
    }

    .yw-wrap *,
    .yw-overlay * {
        box-sizing: border-box;
    }

    .yw-head {
        padding: 8px 0 40px;
        text-align: center;
        position: relative;
    }

    .yw-back-btn {
        position: absolute;
        left: 0;
        top: 8px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
    }

    .yw-head-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
        margin-top: 10px;
    }

    .yw-head-title h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0;
        color: #090909;
    }

    .yw-head p {
        color: #464F58;
        font-size: 14px;
        margin: 0;
        line-height: 1.5;
    }

    .yw-btn {
        width: 100%;
        border: none;
        border-radius: 30px;
        font-weight: 700;
        cursor: pointer;
        font-size: 15px;
        font-family: inherit;
        transition: .15s;
        padding: 16px;
    }

    .yw-btn-primary {
        background: #3182f6;
        color: #fff;
    }

    .yw-btn-primary:active {
        background: #1b64da;
        transform: scale(.98);
    }

    .yw-btn-ghost {
        background: #F3F4F8;
        color: #090909;
        border-radius: 20px;
    }
    
    .yw-btn-ghost:active {
        background: #e5e8eb;
        transform: scale(.98);
    }

    .yw-member {
        background: #fff;
        border-radius: 30px;
        padding: 24px 30px;
        margin-bottom: 24px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .03);
    }

    .yw-member .yw-hi {
        font-size: 18px;
        font-weight: 800;
        color: #090909;
        margin-bottom: 12px;
    }

    .yw-member .yw-sub {
        display: flex;
        gap: 24px;
        color: #81888D;
        font-size: 15px;
    }
    .yw-member .yw-sub span {
        display: inline-block;
    }

    .yw-list-header {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 16px;
        color: #090909;
    }

    .yw-list-header .yw-count {
        color: #259FD3;
    }

    #yw-list {
        margin-top: 40px;
    }

    .yw-banner {
        border-radius: 30px;
        padding: 15px 16px;
        font-size: 14px;
        margin-bottom: 14px;
        display: none;
        line-height: 1.5;
    }

    .yw-banner.yw-show {
        display: block;
    }

    .yw-banner.yw-warn {
        background: #fff4e6;
        color: #b45309;
    }

    .yw-banner.yw-err {
        background: #fde8ea;
        color: #c0303c;
    }

    .yw-card {
        background: #fff;
        border-radius: 30px;
        padding: 24px 30px;
        margin-bottom: 16px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .03);
    }

    .yw-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
    }

    .yw-card-info {
        flex: 1;
    }

    .yw-card .yw-pname {
        font-size: 16px;
        font-weight: 800;
        color: #090909;
        line-height: 1.4;
        word-break: break-all;
    }

    .yw-card .yw-pspec {
        color: #81888D;
        font-size: 14px;
        margin-top: 10px;
    }

    .yw-status {
        background: #E5F5FC;
        color: #259FD3;
        font-size: 13px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 30px;
        white-space: nowrap;
    }

    .yw-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
    }

    .yw-chip {
        background: #EFF0F3;
        color: #81888D;
        font-size: 13px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 30px;
    }

    .yw-warrbox {
        margin: 24px auto 16px;
        width: 80%;
        background: #E5F5FC;
        border-radius: 30px;
        padding: 12px 16px;
        font-size: 13px;
        color: #505967;
        text-align: center;
        position: relative;
    }

    .yw-warrbox::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        border-top: 6px solid #E5F5FC;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
    }

    .yw-warrbox b {
        color: #259FD3;
        font-weight: 700;
    }

    .yw-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 700;
        padding: 5px 11px;
        border-radius: 30px;
    }

    .yw-pill.yw-promo {
        background: #fff4e6;
        color: #d97706;
    }

    .yw-empty {
        text-align: center;
        color: #81888D;
        padding: 48px 0;
        font-size: 15px;
    }

    .yw-spin {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #fff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: yw-s .7s linear infinite;
        vertical-align: -3px;
        margin-right: 7px;
    }

    @keyframes yw-s {
        to {
            transform: rotate(360deg);
        }
    }

    /* 정품인증서 모달 */
    .yw-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .5);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 99999;
    }

    .yw-overlay.yw-show {
        display: flex;
    }

    .yw-cert {
        background-color: #f9f9f9;
        background-image: url('/web/icon/bgbg.png');
        background-size: cover;
        background-position: center;
        border-radius: 30px;
        max-width: 400px;
        width: 100%;
        padding: 32px 24px 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
        font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
        text-align: center;
    }

    .yw-cert-t2 {
        font-size: 13px;
        color: #81888D;
        margin-bottom: 8px;
    }

    .yw-cert-t1 {
        font-size: 24px;
        font-weight: 800;
        color: #090909;
        margin-bottom: 24px;
        letter-spacing: -0.5px;
    }

    .yw-cert-prod {
        background: #FAFAFA;
        border-radius: 30px;
        padding: 24px 20px;
        box-shadow: 5px 12px 20px rgba(216, 216, 216, 0.57);
        margin: 0 auto 24px auto;
        width: 80%;
    }

    .yw-cert-logo {
        margin: 0 auto 16px;
    }

    .yw-cert-prod-name {
        font-size: 15px;
        font-weight: 600;
        color: #090909;
        line-height: 1.5;
        word-break: break-all;
    }

    .yw-cert-desc {
        font-size: 12.5px;
        color: #81888D;
        line-height: 1.5;
        margin-bottom: 32px;
    }

    .yw-cert-group {
        text-align: left;
        margin-bottom: 24px;
    }

    .yw-cert-lbl {
        font-size: 14px;
        color: #81888D;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .yw-cert-no-box {
        background: #8383831F;
        border-radius: 8px;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .yw-cert-no-val {
        font-size: 18px;
        font-weight: 700;
        color: #090909;
        letter-spacing: 1px;
    }
    
    .yw-cert-dl {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .yw-cert-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        font-size: 14.5px;
    }

    .yw-cert-row .yw-k {
        color: #81888D;
    }

    .yw-cert-row .yw-v {
        color: #090909;
        font-weight: 600;
        text-align: right;
    }

    .yw-btn-dark {
        background: #464F58;
        color: #fff;
        margin-top: 24px;
    }
    .yw-btn-dark:active {
        background: #333d4b;
        transform: scale(.98);
    }

    @media (max-width: 500px) {
        .yw-wrap { padding: 20px 16px 60px; }
        .yw-head { padding-bottom: 24px; }
        .yw-member, .yw-card { padding: 20px 20px; border-radius: 20px; }
        .yw-warrbox { width: 100%; margin: 16px auto 12px; }
        .yw-cert { padding: 24px 20px 20px; }
        .yw-cert-prod { width: 100%; padding: 20px 16px; border-radius: 20px; margin-bottom: 16px; }
        .yw-cert-no-box { padding: 12px 16px; }
        .yw-btn { padding: 14px; font-size: 14px; }
    }
</style>

<div class="yw-wrap">
    <div class="yw-head">
        <button class="yw-back-btn" onclick="history.back()">
        </button>
        <div class="yw-head-title">
            <img src="/web/icon/2026_icon_01.png" alt="icon" style="width: 32px; height: 32px;">
            <h1>요기보 정품인증</h1>
        </div>
        <p>구매하신 제품을 정품인증하면 보증기간이 연장됩니다.<br /><span style="font-weight: 600;">기본 1년 · 프로모션 기간 인증 시 1년 6개월</span></p>
    </div>
    <div id="yw-banner" class="yw-banner"></div>
    <div id="yw-authState"></div>
    <div id="yw-member"></div>
    <div id="yw-list"></div>

    <!-- 정품인증서 모달 -->
    <div class="yw-overlay" id="yw-overlay">
        <div class="yw-cert" id="yw-cert"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    (function () {
        // ===== 설정 =====
        var CAFE24_APP_KEY = 'R4as6neTNyXXjVfpfUj9lE';
        var ADMIN_SERVER = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app';
        var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.origin === ADMIN_SERVER) ? '' : ADMIN_SERVER;
        var LOGIN_BASE = '/member/login.html';

        var sdkRetry = 0, idRetry = 0, currentMember = null, itemsCache = {};
        var $ = function (id) { return document.getElementById(id); };
        var esc = function (s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); };

        function banner(text, type) { var b = $('yw-banner'); if (!text) { b.className = 'yw-banner'; return; } b.textContent = text; b.className = 'yw-banner yw-show yw-' + (type || 'warn'); }
        function setAuthState(html) { $('yw-authState').innerHTML = html || ''; }

        function jsonFetch(url, opts) {
            return fetch(url, opts).then(function (r) {
                return r.text().then(function (t) {
                    if (!t) throw new Error('서버 응답이 비어 있습니다. (' + r.status + ')');
                    try { return JSON.parse(t); } catch (e) { throw new Error('서버 응답 형식 오류 (' + r.status + ')'); }
                });
            });
        }

        // ===== 회원 아이디 취득 (Cafe24 스토어프론트 SDK — 이벤트 페이지와 동일) =====
        document.addEventListener('DOMContentLoaded', function () {
            var q = new URLSearchParams(location.search).get('memberId');
            if (q) { console.log('[정품인증] ?memberId=', q); lookup(q); return; }
            setAuthState('<div class="yw-member"><div class="yw-hi">회원 정보를 확인하고 있어요...</div></div>');
            initMember();
        });

        function initMember() {
            if (typeof CAFE24API === 'undefined') {
                if (sdkRetry++ < 20) { setTimeout(initMember, 500); return; }
                console.warn('[정품인증] CAFE24API 로드 실패');
                showLogin(); return;
            }
            try {
                CAFE24API.init(CAFE24_APP_KEY);
                CAFE24API.getMemberID(function (res) {
                    console.log('[정품인증] getMemberID:', JSON.stringify(res));
                    if (res && res !== 'GUEST') { setAuthState(''); lookup(res); }
                    else if (idRetry++ < 5) { setTimeout(initMember, 500); }
                    else { showLogin(); }
                });
            } catch (err) { console.error('[정품인증] CAFE24API 오류:', err); showLogin(); }
        }

        function showLogin() {
            setAuthState('<div class="yw-member" style="text-align:center">'
                + '<div class="yw-hi">로그인이 필요해요</div>'
                + '<div class="yw-sub" style="display:block;margin:8px 0 18px;line-height:1.5">로그인하면 구매하신 제품을 자동으로 불러와<br/>정품인증할 수 있어요.</div>'
                + '<button class="yw-btn yw-btn-primary" style="margin-top:0" onclick="__ywGoLogin()">로그인하기</button></div>');
        }
        window.__ywGoLogin = function () {
            var ret = location.pathname + location.search + location.hash;
            location.href = LOGIN_BASE + '?returnUrl=' + encodeURIComponent(ret);
        };

        function lookup(memberId) {
            memberId = String(memberId || '').trim();
            if (!memberId) { showLogin(); return; }
            banner(''); setAuthState(''); $('yw-member').innerHTML = ''; currentMember = memberId; itemsCache = {};
            console.log('[정품인증] 📤 lookup memberId =', JSON.stringify(memberId));
            $('yw-list').innerHTML = '<div class="yw-empty">불러오는 중...</div>';
            jsonFetch(API + '/api/warranty/lookup?memberId=' + encodeURIComponent(memberId)).then(function (r) {
                if (!r.success) { console.warn('[정품인증] lookup 실패:', r); banner(r.message || '조회에 실패했어요.', 'err'); $('yw-list').innerHTML = ''; return; }
                $('yw-member').innerHTML = '<div class="yw-member"><div class="yw-hi">' + esc(r.member.name) + ' 님</div><div class="yw-sub"><span>' + esc(r.member.memberId) + '</span><span>' + esc(r.member.phone) + '</span></div></div>';
                if (!r.member.matchable) banner('가입하신 휴대폰번호(010)가 확인되지 않아 자동 정품인증이 어렵습니다. 고객센터로 문의해 주세요.', 'warn');
                r.items.forEach(function (it) { itemsCache[it.rowHash] = it; });
                renderList(r.items);
            }).catch(function (e) { banner(e.message, 'err'); $('yw-list').innerHTML = ''; });
        }

        function renderList(items) {
            if (!items || !items.length) { $('yw-list').innerHTML = '<div class="yw-empty">매칭되는 구매 제품이 없어요.</div>'; return; }
            
            var html = '<div class="yw-list-header">정품 인증 제품 <span class="yw-count">총 ' + items.length + '개</span></div>';
            
            html += items.map(function (it) {
                var done = it.authorized;
                var promo = it.preview.promotion;
                var warr = done
                    ? '<div class="yw-warrbox">정품인증 완료 · 보증 <b>' + done.months + '개월</b> · 만료 <b>' + done.endDate + '</b></div>'
                    : '<div class="yw-warrbox">예상 보증 <b>' + it.preview.months + '개월</b> · 만료 <b>' + it.preview.endDate + '</b>' + (promo ? ' <span class="yw-pill yw-promo">' + esc(promo.name || '프로모션') + '</span>' : '') + '</div>';
                var action = done
                    ? '<button class="yw-btn yw-btn-ghost" onclick="__ywShowCert(\'' + it.rowHash + '\')">정품인증서 보기</button>'
                    : '<button class="yw-btn yw-btn-primary" onclick="__ywAuth(\'' + it.rowHash + '\', this)">이 제품 정품인증하기</button>';
                
                var topStatus = done ? '<span class="yw-status">인증완료</span>' : '<span class="yw-status" style="background:#f2f4f6;color:#8b95a1">미인증</span>';
                
                return '<div class="yw-card">'
                    + '<div class="yw-card-top">'
                    + '<div class="yw-card-info"><div class="yw-pname">' + esc(it.productName) + '</div><div class="yw-pspec">' + esc(it.spec) + '</div></div>'
                    + topStatus
                    + '</div>'
                    + '<div class="yw-meta"><span class="yw-chip">구매일 ' + esc(it.saleDateStr) + '</span><span class="yw-chip">' + esc(it.channel) + '</span></div>'
                    + warr + action + '</div>';
            }).join('');
            
            $('yw-list').innerHTML = html;
        }

        window.__ywAuth = function (rowHash, btnEl) {
            if (!currentMember) return;
            btnEl.disabled = true; btnEl.innerHTML = '<span class="yw-spin"></span>인증 처리중';
            jsonFetch(API + '/api/warranty/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ memberId: currentMember, rowHashes: [rowHash] })
            }).then(function (r) {
                if (!r.success || !r.results || !r.results[0] || !r.results[0].ok) {
                    banner((r.results && r.results[0] && r.results[0].reason) || r.message || '인증에 실패했어요.', 'err');
                    btnEl.disabled = false; btnEl.textContent = '이 제품 정품인증하기'; return;
                }
                var res = r.results[0]; var it = itemsCache[rowHash] || {};
                openCert({ certNo: res.certNo, productName: it.productName, spec: it.spec, saleDateStr: it.saleDateStr, months: res.months, endDate: res.endDate, promotionName: res.promotionName, authAt: new Date().toISOString() });
                lookup(currentMember);
            }).catch(function (e) { banner(e.message, 'err'); btnEl.disabled = false; btnEl.textContent = '이 제품 정품인증하기'; });
        };

        window.__ywShowCert = function (rowHash) {
            var it = itemsCache[rowHash]; if (!it || !it.authorized) return;
            openCert({ certNo: it.authorized.certNo, productName: it.productName, spec: it.spec, saleDateStr: it.saleDateStr, months: it.authorized.months, endDate: it.authorized.endDate, promotionName: null, authAt: it.authorized.at });
        };

        function openCert(c) {
            var d = c.authAt ? new Date(c.authAt) : new Date();
            var authDate = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
            var prodText = esc(c.productName) + (c.spec ? ' / ' + esc(c.spec) : '');
            $('yw-cert').innerHTML = ''
                + '<div class="yw-cert-t2">Certificate Of Authenticity</div>'
                + '<div class="yw-cert-t1">요기보 공식 정품인증서</div>'
                + '<div class="yw-cert-prod">'
                + '<div class="yw-cert-logo"><img src="/web/img/icon/logo3_on.png" alt="yogibo" style="height: 20px;"></div>'
                + '<div class="yw-cert-prod-name">' + prodText + '</div>'
                + '</div>'
                + '<div class="yw-cert-desc">본 인증서의 인증번호는 A/S 접수 시 필요합니다.<br/>다운로드 버튼을 눌러 이미지를 보관해주세요.</div>'
                + '<div class="yw-cert-group">'
                + '<div class="yw-cert-lbl">인증번호</div>'
                + '<div class="yw-cert-no-box"><div class="yw-cert-no-val">' + esc(c.certNo) + '</div><button class="yw-cert-dl" onclick="__ywDownloadCert()"><img src="/web/icon/download.png" style="width: 24px; height: 24px;" alt="download"></button></div>'
                + '</div>'
                + '<div class="yw-cert-row"><span class="yw-k">구매일</span><span class="yw-v">' + esc(c.saleDateStr).replace(/-/g, '.') + '</span></div>'
                + '<div class="yw-cert-row"><span class="yw-k">인증일자</span><span class="yw-v">' + authDate + '</span></div>'
                + '<div class="yw-cert-row"><span class="yw-k">보증기간</span><span class="yw-v">' + c.months + '개월</span></div>'
                + '<div class="yw-cert-row"><span class="yw-k">보증만료</span><span class="yw-v">' + esc(c.endDate).replace(/-/g, '.') + '</span></div>'
                + '<button class="yw-btn yw-btn-dark" onclick="__ywCloseCert()">확인</button>';
            $('yw-overlay').classList.add('yw-show');
        }
        window.__ywCloseCert = function () { $('yw-overlay').classList.remove('yw-show'); };
        
        window.__ywDownloadCert = function () {
            if (typeof html2canvas === 'undefined') {
                banner('다운로드 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
                return;
            }
            var el = $('yw-cert');
            var btnDl = el.querySelector('.yw-cert-dl');
            var btnConfirm = el.querySelector('.yw-btn-dark');
            if (btnDl) btnDl.style.display = 'none';
            if (btnConfirm) btnConfirm.style.display = 'none';

            html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#f9f9f9' }).then(function (canvas) {
                if (btnDl) btnDl.style.display = '';
                if (btnConfirm) btnConfirm.style.display = '';
                var link = document.createElement('a');
                link.download = '요기보_정품인증서.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(function(err) {
                if (btnDl) btnDl.style.display = '';
                if (btnConfirm) btnConfirm.style.display = '';
                console.error(err);
                banner('이미지 저장에 실패했습니다.', 'err');
            });
        };

        $('yw-overlay') && ($('yw-overlay').onclick = function (e) { if (e.target === this) window.__ywCloseCert(); });
    })();
</script>
